<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAASL – Drone Approval System</title>

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" />
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            caaslNavy: '#030f27',
            caaslBlue: '#1388d1',
          },
        },
      },
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      color: #555;
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      background: #f4f7f9;
      margin: 0;
      padding: 0;
    }

    a { color: #1388d1; text-decoration: none; transition: color .2s; }
    a:hover { color: #030f27; }

    .top-bar { height: auto; background: #fff; padding: 15px 0; border-bottom: 1px solid #eaeaea; }
    @media (min-width: 992px) { .top-bar { height: 90px; padding: 0 60px; display: flex; align-items: center; } }

    .footer { background: #030f27; color: #fff; padding: 60px 0 0; margin-top: 50px; }
    .copyright { background: #020a1a; padding: 20px 0; margin-top: 30px; }

    /* Leaflet z-index override so tooltips appear above nav */
    .leaflet-pane { z-index: 400 !important; }
    .leaflet-control { z-index: 800 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 800 !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
